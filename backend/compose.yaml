services:
    neurobank_db:
        image: postgres:18.6
        container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be defined}
            POSTGRES_USER: ${POSTGRES_USERNAME:?POSTGRES_USERNAME must be defined}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}
            POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8}
            TZ: ${TZ}
        
        ports:
            - "${POSTGRES_HOST_PORT:-5432}:5432"
        
        volumes:
            - postgres_data:${POSTGRES_DATA_PATH:-/var/lib/postgresql}
        
        healthcheck:
            test: 
                - CMD-SHELL
                # $$ENV_VAR ensures that the value in the container's
                # environment is used here, which is better practice.
                - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
            interval: 60s
            timeout: 5s
            retries: 5

        networks:
            - neurobank_network

volumes:
    postgres_data:
        driver: local
        name: ${POSTGRES_VOLUME_NAME:-postgres_data}

networks:
    neurobank_network:
        driver: bridge
        name: ${POSTGRES_NETWORK_NAME:-postgres_network}
