# Keep integration-test objects isolated from the application's public schema.
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS neurobank_test
spring.jpa.properties.hibernate.default_schema=neurobank_test
spring.jpa.hibernate.ddl-auto=create

# Tests create only the records they need.
spring.sql.init.mode=never
spring.jpa.show-sql=false

# Scheduled execution is invoked explicitly by tests.
app.scheduled-transfers.enabled=false
